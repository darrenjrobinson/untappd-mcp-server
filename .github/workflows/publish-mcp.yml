name: Publish to npm & MCP Registry

# Triggered by pushing a version tag (e.g. v1.0.3).
#
# Auth is tokenless (OIDC) for both targets:
#  - npm: Trusted Publishing — one-time setup at npmjs.com → package Settings →
#    Trusted Publisher → GitHub Actions (owner: darrenjrobinson,
#    repo: untappd-mcp-server, workflow: publish-mcp.yml). Provenance is
#    generated automatically.
#  - MCP Registry: GitHub OIDC authorises the io.github.darrenjrobinson/*
#    namespace because this workflow runs in that owner's repo.

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC for npm trusted publishing + MCP Registry
  contents: read

jobs:
  publish:
    name: Publish npm package & registry entry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing requires npm >= 11.5.1 (Node 22 bundles npm 10)
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json and server.json versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG package.json=$PKG server.json=$SRV server.json.packages[0]=$SRV_PKG"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ] || [ "$TAG" != "$SRV_PKG" ]; then
            echo "::error::Version mismatch — bump package.json and server.json (both version fields) to $TAG before tagging."
            exit 1
          fi

      # Idempotent: a re-run after a partial release must not fail here, because
      # npm rejects publishing over an existing version with E403.
      #
      # The check reads registry.npmjs.org directly rather than using `npm view`,
      # which is served through a cache that can report a stale version list.
      - name: Publish to npm
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' \
            "https://registry.npmjs.org/$NAME/$TAG" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "npm already has $NAME@$TAG — skipping publish."
          else
            npm publish
          fi

      # npm warns on publish that the package "may take a few minutes to become
      # available". mcp-publisher rejects a server whose npm version 404s, so
      # handing off immediately is a race — it failed for v2.1.0 seconds after
      # npm accepted the publish. Wait for npm to actually serve the version.
      - name: Wait for npm to serve the new version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          for i in $(seq 1 60); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/$NAME/$TAG" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "npm is serving $NAME@$TAG (after $i attempt(s))."
              exit 0
            fi
            echo "attempt $i/60: npm returned $CODE, waiting 5s…"
            sleep 5
          done
          echo "::error::npm did not serve $NAME@$TAG within 5 minutes. It may still appear shortly — re-run the failed job from the Actions tab."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # Idempotent: skip when the registry already advertises this version, so a
      # re-run of a fully successful release is a no-op rather than an error.
      #
      # Looks up the exact server via /versions/latest rather than ?search=,
      # which is paginated and substring-matched. An unknown server returns 404
      # with no .server, so CURRENT stays empty and the publish goes ahead.
      - name: Publish to MCP Registry
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SERVER=$(node -p "require('./server.json').name")
          SERVER_ENC=$(node -p "encodeURIComponent(require('./server.json').name)")
          CURRENT=$(curl -sS "https://registry.modelcontextprotocol.io/v0/servers/$SERVER_ENC/versions/latest" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).server?.version||'')}catch(e){process.stdout.write('')}})" || echo "")
          if [ "$CURRENT" = "$TAG" ]; then
            echo "MCP Registry already publishes $SERVER $TAG — skipping."
          else
            echo "MCP Registry currently at '${CURRENT:-none}', publishing $TAG."
            ./mcp-publisher publish
          fi

      - name: Summary
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          {
            echo "### Published v${TAG}"
            echo ""
            echo "| Target | Location |"
            echo "|--------|----------|"
            echo "| npm | https://www.npmjs.com/package/untappd-mcp-server/v/${TAG} |"
            echo "| MCP Registry | io.github.darrenjrobinson/untappd |"
          } >> "$GITHUB_STEP_SUMMARY"
