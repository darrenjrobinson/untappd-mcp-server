version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) drops the JS API ts-node relies on;
      # move to it deliberately rather than via a grouped dev bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # The v2 SDK packages share one version (server pins core exactly), so
      # they must move together. Listed first: a package joins the first
      # group it matches.
      mcp-sdk:
        patterns: ["@modelcontextprotocol/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
